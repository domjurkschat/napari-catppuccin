name: napari-catppuccin
display_name: Catppuccin
# Roles follow the Catppuccin style guide: base = main pane (canvas),
# mantle/crust = secondary panes, surfaces = widgets, Overlay 2 at 30% over
# base = selection (highlight), lavender = active (current, 25% over base so
# Text stays readable on it), yellow = warning, red = error.
contributions:
  themes:
    - id: catppuccin_latte
      label: Catppuccin Latte
      type: light
      colors:
        canvas: "#eff1f5"
        console: "#dce0e8"
        background: "#e6e9ef"
        foreground: "#ccd0da"
        primary: "#bcc0cc"
        secondary: "#acb0be"
        highlight: "#cccfd8"
        text: "#4c4f69"
        icon: "#5c5f77"
        warning: "#df8e1d"
        error: "#d20f39"
        current: "#d0d6f7"
    - id: catppuccin_frappe
      label: Catppuccin Frappé
      type: dark
      colors:
        canvas: "#303446"
        console: "#232634"
        background: "#292c3c"
        foreground: "#414559"
        primary: "#51576d"
        secondary: "#626880"
        highlight: "#4e5369"
        text: "#c6d0f5"
        icon: "#b5bfe2"
        warning: "#e5c890"
        error: "#e78284"
        current: "#525671"
    - id: catppuccin_macchiato
      label: Catppuccin Macchiato
      type: dark
      colors:
        canvas: "#24273a"
        console: "#181926"
        background: "#1e2030"
        foreground: "#363a4f"
        primary: "#494d64"
        secondary: "#5b6078"
        highlight: "#454a60"
        text: "#cad3f5"
        icon: "#b8c0e0"
        warning: "#eed49f"
        error: "#ed8796"
        current: "#494c6a"
    - id: catppuccin_mocha
      label: Catppuccin Mocha
      type: dark
      colors:
        canvas: "#1e1e2e"
        console: "#11111b"
        background: "#181825"
        foreground: "#313244"
        primary: "#45475a"
        secondary: "#585b70"
        highlight: "#414356"
        text: "#cdd6f4"
        icon: "#bac2de"
        warning: "#f9e2af"
        error: "#f38ba8"
        current: "#444662"
