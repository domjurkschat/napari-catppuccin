[project]
name = "napari-catppuccin"
version = "0.1.0"
description = "Catppuccin themes (Latte, Frappé, Macchiato, Mocha) for napari."
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{name = "Dominic Jurkschat", email = "dom.jurkschat@monash.edu"}]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: napari",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Image Processing",
]
requires-python = ">=3.10"

[project.optional-dependencies]
all = ["napari[all]"]

[project.entry-points."napari.manifest"]
napari-catppuccin = "napari_catppuccin:napari.yaml"

[project.urls]
"Bug Tracker" = "https://github.com/domjurkschat/napari-catppuccin/issues"
"Source Code" = "https://github.com/domjurkschat/napari-catppuccin"

[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
napari_catppuccin = ["napari.yaml"]
